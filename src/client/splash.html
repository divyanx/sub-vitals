<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubVitals</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      gap: 1.5rem;
      max-width: 420px;
    }
    .logo { width: 72px; height: 72px; border-radius: 14px; }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    .desc { color: #a3a3a3; font-size: 0.8rem; line-height: 1.5; }
    .btn {
      padding: 0.7rem 1.5rem;
      background: #ff4500;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #e03d00; }
    .badge {
      padding: 0.2rem 0.6rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 999px;
      font-size: 0.65rem;
      color: #737373;
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="logo-256.png" alt="SubVitals" class="logo" />
    <h1>SubVitals · Live Analytics</h1>
    <p class="desc">Customer experience mod cockpit for brand subreddits</p>
    <a href="index.html" class="btn">Open Dashboard →</a>
    <span class="badge">Mod-only · Powered by AI</span>
  </div>
</body>
</html>
